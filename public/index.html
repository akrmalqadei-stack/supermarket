<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>نظام إدارة ونقاط بيع السوبرماركت - الإصدار المتطور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<!-- مكتبة توليد QR ومسح الباركود من الكاميرا -->
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#0d9488;--primary-dark:#0f766e;--accent:#06b6d4;--success:#10b981;
  --warning:#f59e0b;--danger:#ef4444;--info:#3b82f6;--purple:#8b5cf6;
  --bg:#f8fafc;--card:#ffffff;--text:#0f172a;--muted:#64748b;--light:#94a3b8;
  --border:#e2e8f0;--border2:#cbd5e1;
  --shadow:0 4px 6px -1px rgb(0 0 0 / 0.08), 0 2px 4px -2px rgb(0 0 0 / 0.06);
  --shadow-lg:0 10px 15px -3px rgb(0 0 0 / 0.1);
  --shadow-xl:0 20px 25px -5px rgb(0 0 0 / 0.15);
  --r:14px;--tr:0.2s cubic-bezier(0.4,0,0.2,1)
}
[data-theme="dark"]{
  --bg:#0b111e;--card:#151e2e;--text:#f1f5f9;--muted:#94a3b8;--light:#64748b;
  --border:#1e293b;--border2:#334155;
}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background var(--tr),color var(--tr);font-size:13.5px}

/* Helpers */
.kbd{display:inline-block;padding:2px 5px;font-size:10.5px;font-weight:700;color:var(--muted);background:var(--bg);border:1px solid var(--border2);border-radius:5px}
.badge{font-size:11px;padding:3px 8px;border-radius:999px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.badge.ok{background:color-mix(in srgb,var(--success) 15%,transparent);color:var(--success)}
.badge.lw{background:color-mix(in srgb,var(--warning) 15%,transparent);color:var(--warning)}
.badge.ot{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.badge.ct{background:color-mix(in srgb,var(--purple) 15%,transparent);color:var(--purple)}

/* Login Screen */
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#042f2e 0%,#0f172a 100%)}
.login-box{position:relative;z-index:1;width:100%;max-width:440px;background:var(--card);padding:40px 32px;border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.4);border:1px solid var(--border)}
.login-logo{width:75px;height:75px;border-radius:20px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 20px;color:#fff}
.login-box h1{text-align:center;font-size:22px;font-weight:800;margin-bottom:4px}
.login-box .sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:24px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.form-control{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:13.5px;font-family:inherit;color:var(--text);background:var(--card);transition:all var(--tr)}
.form-control:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(13,148,136,.15)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fr3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

/* Layout */
#app{display:none;min-height:100vh}
#app.active{display:block}
.sidebar{position:fixed;top:0;right:0;bottom:0;width:250px;background:var(--card);border-left:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;z-index:100;transition:transform .3s ease;overflow-y:auto}
.sb-logo{display:flex;align-items:center;gap:10px;padding:12px;margin-bottom:16px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff}
.ni{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);cursor:pointer;font-size:13px;font-weight:600;margin-bottom:3px;border:none;background:transparent;width:100%;text-align:right;font-family:inherit;transition:all var(--tr)}
.ni:hover{background:var(--bg);color:var(--text)}
.ni.active{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;font-weight:700}
.main{margin-right:250px;min-height:100vh;transition:margin .3s ease}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.content{padding:18px;max-width:1440px;margin:0 auto}

/* Buttons */
.btn{padding:9px 16px;border:none;border-radius:10px;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all var(--tr);background:var(--primary);color:#fff}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-s{background:linear-gradient(135deg,#10b981,#059669)}
.btn-d{background:linear-gradient(135deg,#ef4444,#dc2626)}
.btn-w{background:linear-gradient(135deg,#f59e0b,#d97706)}
.btn-i{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.btn-p{background:linear-gradient(135deg,var(--primary),var(--accent))}
.btn-g{background:transparent;color:var(--text);border:1.5px solid var(--border2)}
.btn-g:hover{background:var(--bg);border-color:var(--primary)}
.btn-sm{padding:6px 10px;font-size:11.5px;border-radius:8px}

/* Cards & Grid */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.ct{font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px}

/* POS Screen */
.pos{display:grid;grid-template-columns:1fr 420px;gap:14px;align-items:start}
.cat-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.cat-chip{padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--bg);color:var(--muted);font-size:11.5px;font-weight:700;white-space:nowrap;cursor:pointer}
.cat-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;max-height:calc(100vh - 280px);overflow-y:auto}
.pt-t{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;transition:all var(--tr);display:flex;flex-direction:column;justify-content:space-between;min-height:105px}
.pt-t:hover{border-color:var(--primary);transform:translateY(-2px)}
.pt-t.off{opacity:.4;pointer-events:none}
.pt-t .pn{font-size:12.5px;font-weight:700;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pt-t .pp{font-size:14.5px;font-weight:800;color:var(--primary)}

/* Cart */
.cart{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;position:sticky;top:65px;max-height:calc(100vh - 85px);display:flex;flex-direction:column}
.cart-items{flex:1;overflow-y:auto;margin:8px 0;min-height:140px;max-height:calc(100vh - 460px)}
.ci{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)}
.ci .ii{flex:1;min-width:0}
.ci .ii strong{display:block;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .cq{display:flex;align-items:center;gap:2px;background:var(--bg);border-radius:8px;padding:2px}
.ci .cq button{width:22px;height:22px;border:none;background:transparent;color:var(--text);font-size:13px;font-weight:800;cursor:pointer}
.ci .cit{font-size:13px;font-weight:800;color:var(--primary);min-width:70px;text-align:left}
.csum{padding-top:8px;border-top:1.5px dashed var(--border2)}
.srow{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;color:var(--muted);font-weight:600}
.srow.tt{font-size:16px;font-weight:900;color:var(--text);padding-top:6px;margin-top:4px;border-top:1.5px dashed var(--border2)}
.srow.tt .amt{color:var(--primary);font-size:19px}
.pay-methods{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 0}
.pm{padding:8px 2px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--muted);font-size:10px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.pm.active{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border-color:var(--primary)}

/* Modals */
.overlay{position:fixed;inset:0;background:rgba(10,14,23,.75);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}
.overlay.active{display:flex}
.modal{background:var(--card);border-radius:20px;padding:22px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;border:1px solid var(--border)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.mc{width:28px;height:28px;border-radius:8px;background:var(--bg);border:none;color:var(--muted);font-size:15px;cursor:pointer}
.mf{display:flex;gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}

/* Receipt */
.receipt{font-size:11.5px;color:#000;background:#fff;padding:10px;border-radius:6px;font-family:'Courier New',Courier,monospace;line-height:1.4}
.receipt-header{text-align:center;border-bottom:1px dashed #000;padding-bottom:8px;margin-bottom:8px}
.receipt-table{width:100%;border-collapse:collapse;margin:8px 0}
.receipt-table th{border-bottom:1px solid #000;padding:4px 0;text-align:right}
.receipt-table td{padding:4px 0}
.receipt-total{border-top:1px dashed #000;border-bottom:1px dashed #000;padding:6px 0;margin:6px 0;font-weight:900;display:flex;justify-content:space-between;font-size:13.5px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);padding:16px;border-radius:var(--r);border:1px solid var(--border)}
.stat .sl{font-size:12px;color:var(--muted);font-weight:700}
.stat .sv{font-size:20px;font-weight:900;color:var(--sc,var(--text));margin-top:4px}

/* Toasts */
.toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--card);color:var(--text);padding:10px 16px;border-radius:10px;font-size:12.5px;font-weight:700;box-shadow:var(--shadow-xl);border-right:4px solid var(--primary);pointer-events:auto}
.toast.success{border-right-color:var(--success)}
.toast.error{border-right-color:var(--danger)}
.toast.warning{border-right-color:var(--warning)}

@media(max-width:1024px){
  .sidebar{transform:translateX(100%)}
  .sidebar.open{transform:translateX(0);box-shadow:-10px 0 30px rgba(0,0,0,.3)}
  .main{margin-right:0}
  .pos{grid-template-columns:1fr}
  .cart{position:static;max-height:none}
}
@media print{
  body *{visibility:hidden}
  #receiptModal, #receiptModal *{visibility:visible}
  #receiptModal{position:absolute;left:0;top:0;width:100%;background:#fff;padding:0;display:block}
  #receiptModal .modal{border:none;box-shadow:none;max-width:100%}
  .no-print{display:none!important}
}
</style>
</head>
<body>

<!-- صفحة تسجيل الدخول -->
<div id="loginPage">
  <div class="login-box">
    <div class="login-logo">🛒</div>
    <h1>نظام السوبرماركت المطور</h1>
    <p class="sub">نظام متكامل لنقاط البيع وإدارة المخزون والحسابات</p>
    <div class="fg"><label>اسم المستخدم</label><input id="username" class="form-control" placeholder="admin"></div>
    <div class="fg"><label>كلمة المرور</label><input id="password" type="password" class="form-control" placeholder="••••••••"></div>
    <button class="btn btn-p" style="width:100%;padding:12px;margin-top:8px" onclick="Auth.login()">🚀 تسجيل الدخول</button>
    <div style="font-size:11.5px;color:var(--muted);margin-top:14px;text-align:center">الدخول السريع: <b>admin / admin123</b></div>
  </div>
</div>

<!-- التطبيق الرئيسي -->
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-logo">
      <div style="font-size:24px">🏪</div>
      <div><strong id="storeNameMini">سوبرماركت</strong><div style="font-size:10px;opacity:.9">الفرع الرئيسي</div></div>
    </div>
    <div id="navContainer"></div>
    <div style="margin-top:auto;padding-top:10px;border-top:1px solid var(--border)">
      <button class="btn btn-g btn-sm" style="width:100%;margin-bottom:6px" onclick="CustomerScreen.openWindow()">🖥️ شاشة العميل</button>
      <button class="btn btn-d btn-sm" style="width:100%" onclick="Auth.logout()">🚪 تسجيل الخروج</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:10px">
        <button class="btn btn-g btn-sm" style="display:none" id="menuToggle" onclick="$('sidebar').classList.toggle('open')">☰</button>
        <h2 id="pageTitle" style="font-size:16px;font-weight:800">نقطة البيع</h2>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <!-- العملة الفعالة وسعر الصرف -->
        <select id="currencySelect" class="form-control" style="width:120px;padding:6px;font-weight:700" onchange="Currency.change(this.value)">
          <option value="YER">YER (ريال يمني)</option>
          <option value="SAR">SAR (ريال سعودي)</option>
          <option value="USD">USD (دولار أمريكي)</option>
        </select>
        <button class="btn btn-g btn-sm" onclick="POS.showHeldCarts()">⏸️ المعلقة (<span id="heldCount">0</span>)</button>
        <button class="btn btn-g btn-sm" onclick="UI.toggleTheme()">🌙</button>
      </div>
    </div>
    <div class="content" id="contentArea"></div>
  </main>
</div>

<!-- التنبيهات -->
<div class="toasts" id="toasts"></div>

<!-- نافذة قارئ الباركود عبر الكاميرا -->
<div class="overlay" id="scannerModal">
  <div class="modal">
    <div class="mh">
      <div style="font-weight:800">📷 مسح الباركود بالكاميرا</div>
      <button class="mc" onclick="Scanner.stop()">✕</button>
    </div>
    <div id="scannerReader" style="width:100%;border-radius:12px;overflow:hidden"></div>
  </div>
</div>

<!-- نافذة سند إيداع / سحب نقدية من الصندوق -->
<div class="overlay" id="cashModal">
  <div class="modal">
    <div class="mh">
      <div style="font-weight:800">💵 حركة نقدية في الدرج</div>
      <button class="mc" onclick="UI.closeModal('cashModal')">✕</button>
    </div>
    <div class="fg"><label>نوع الحركة</label>
      <select id="cashMovementType" class="form-control">
        <option value="out">سحب نثريات / مصاريف (Cash-Out)</option>
        <option value="in">إيداع رصيد إضافي (Cash-In)</option>
      </select>
    </div>
    <div class="fg"><label>المبلغ</label><input id="cashMovementAmount" type="number" class="form-control" placeholder="0"></div>
    <div class="fg"><label>البيان / السبب</label><input id="cashMovementNote" class="form-control" placeholder="فاتورة كهرباء، شراء أكياس..."></div>
    <div class="mf">
      <button class="btn btn-p" style="flex:1" onclick="Register.saveMovement()">حفظ الحركة</button>
    </div>
  </div>
</div>

<!-- نافذة الخصم -->
<div class="overlay" id="discountModal">
  <div class="modal">
    <div class="mh">
      <div style="font-weight:800">🏷️ إضافة خصم تجاري</div>
      <button class="mc" onclick="UI.closeModal('discountModal')">✕</button>
    </div>
    <div class="fg"><label>نوع الخصم</label>
      <select id="discountType" class="form-control">
        <option value="percent">نسبة مئوية (%)</option>
        <option value="amount">مبلغ مقطوع</option>
      </select>
    </div>
    <div class="fg"><label>القيمة</label><input id="discountVal" type="number" class="form-control" placeholder="0"></div>
    <div class="mf">
      <button class="btn btn-s" style="flex:1" onclick="POS.applyDiscount()">تطبيق</button>
    </div>
  </div>
</div>

<!-- نافذة المعلقة -->
<div class="overlay" id="heldModal">
  <div class="modal">
    <div class="mh"><div style="font-weight:800">⏸️ الفواتير المعلقة</div><button class="mc" onclick="UI.closeModal('heldModal')">✕</button></div>
    <div id="heldList"></div>
  </div>
</div>

<!-- نافذة الإيصال الحراري -->
<div class="overlay" id="receiptModal">
  <div class="modal">
    <div class="mh no-print"><div style="font-weight:800">🧾 الإيصال الحراري المعتمد</div><button class="mc" onclick="UI.closeModal('receiptModal')">✕</button></div>
    <div id="receiptBody"></div>
    <div class="mf no-print">
      <button class="btn btn-p" style="flex:1" onclick="window.print()">🖨️ طباعة الفاتورة</button>
      <button class="btn btn-g" onclick="UI.closeModal('receiptModal')">إغلاق</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   قاعدة البيانات المحلية وإدارة الحالة (Central Store)
   ============================================================ */
const DB = {
  get(key, def){ try{ return JSON.parse(localStorage.getItem("pos_"+key)) || def; }catch{ return def; } },
  set(key, val){ localStorage.setItem("pos_"+key, JSON.stringify(val)); }
};

const state = {
  users: DB.get("users", [
    { id: 1, fullName: "المدير العام", username: "admin", password: "admin123", role: "admin" },
    { id: 2, fullName: "الكاشير", username: "cashier", password: "cashier123", role: "cashier" }
  ]),
  products: DB.get("products", [
    { id: 1, name: "حليب طويل الأجل 1 لتر", barcode: "6281001", category: "ألبان", buyPrice: 4.5, sellPrice: 6.0, quantity: 45, minStock: 10 },
    { id: 2, name: "سكر أبيض ناعم 5 كجم", barcode: "6281002", category: "تموين", buyPrice: 18.0, sellPrice: 22.0, quantity: 20, minStock: 5 },
    { id: 3, name: "زيت نباتي نقي 1.5 لتر", barcode: "6281003", category: "زيوت", buyPrice: 14.0, sellPrice: 17.5, quantity: 15, minStock: 6 },
    { id: 4, name: "تونة خفيفة بالزيت 185 جم", barcode: "6281004", category: "معلبات", buyPrice: 5.0, sellPrice: 7.0, quantity: 60, minStock: 15 }
  ]),
  customers: DB.get("customers", [
    { id: 1, name: "عميل نقدي عام", phone: "-", creditLimit: 0, balance: 0 },
    { id: 2, name: "مطعم البركة (آجل)", phone: "770000000", creditLimit: 5000, balance: 1450 }
  ]),
  sales: DB.get("sales", []),
  heldCarts: DB.get("heldCarts", []),
  register: DB.get("register", { status: "open", openingBalance: 500, movements: [] }),
  rates: { YER: 1, SAR: 0.0019, USD: 0.0005 }, // معامل التحويل مقابل الريال اليمني
  currency: "YER",
  cart: [],
  discount: { type: "percent", value: 0 },
  paymentMethod: "cash",
  selectedCustomer: 1,
  currentCategory: "all"
};

const $ = id => document.getElementById(id);
const uid = () => Date.now() + Math.floor(Math.random() * 100);
const fmt = n => (Number(n) || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = t => String(t ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function toast(msg, type = "success"){
  const el = document.createElement("div");
  el.className = "toast " + type;
  el.innerHTML = `<span>${type === "success" ? "✅" : type === "error" ? "❌" : "⚠️"}</span> <span>${esc(msg)}</span>`;
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

/* ============================================================
   محرك العملات المتعددة
   ============================================================ */
const Currency = {
  convert(amt, to = state.currency){
    // السعر الأساسي للمنتجات بالريال اليمني
    if (to === "YER") return amt;
    if (to === "SAR") return amt * 0.0019;
    if (to === "USD") return amt * 0.0005;
    return amt;
  },
  format(amt){
    return fmt(amt) + " " + state.currency;
  },
  change(curr){
    state.currency = curr;
    if (state.currentSection === "pos") { POS.renderGrid(); POS.renderCart(); }
    else Navigation.go(state.currentSection);
  }
};

/* ============================================================

const Navigation = {
  routes: {
    pos: { label: "🛒 نقطة البيع (F1)", adminOnly: false },
    products: { label: "📦 إدارة المخزون", adminOnly: false },
    customers: { label: "👥 العملاء والديون", adminOnly: false },
    register: { label: "💵 صندوق الوردية", adminOnly: false },
    sales: { label: "🧾 سجل الفواتير", adminOnly: false },
    reports: { label: "📊 لوحة التقارير", adminOnly: true }
  },

    let html = "";
    Object.keys(this.routes).forEach(k => {

      html += `<button class="ni ${state.currentSection === k ? 'active' : ''}" onclick="Navigation.go('${k}')">${this.routes[k].label}</button>`;
    });
    $("navContainer").innerHTML = html;

    state.currentSection = sec;
    this.render();

    const el = $("contentArea");
    if (sec === "pos") el.innerHTML = renderPOS();

    if (sec === "pos"){ POS.renderGrid(); POS.renderCart(); }
    if (window.innerWidth <= 1024) $("sidebar").classList.remove("open");
  }
};

   محرك نقطة البيع (POS Engine)

function renderPOS(){

      <div class="cat-chips" id="catChips"></div>
      <div style="display:flex;gap:8px;margin-bottom:10px">

        <button class="btn btn-g" onclick="Scanner.start()" title="مسح بالكاميرا">📷</button>
      </div>
      <div class="pg" id="posGrid"></div>
    </div>
    <aside class="cart">
      <div style="display:flex;justify-content:space-between;align-items:center;padding-bottom:8px;border-bottom:1.5px dashed var(--border2)">
        <div style="font-weight:800">🧾 السلة (<span id="cartCount">0</span>)</div>
        <select id="cartCustomer" class="form-control" style="width:140px;padding:4px" onchange="state.selectedCustomer=Number(this.value)">
          ${state.customers.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("")}
        </select>
      </div>
      <div class="cart-items" id="cartItems"></div>
      <div class="csum">
        <div class="srow"><span>المجموع:</span><span id="subTotal">0</span></div>
        <div class="srow"><span>الخصم:</span><span id="discountDisplay">0</span></div>
        <div class="srow tt"><span>الإجمالي:</span><span class="amt" id="cartTotal">0</span></div>
      </div>
      <div class="pay-methods">
        <button class="pm active" data-pm="cash" onclick="POS.setPayment('cash')">💵 نقد</button>
        <button class="pm" data-pm="card" onclick="POS.setPayment('card')">💳 شبكة</button>
        <button class="pm" data-pm="credit" onclick="POS.setPayment('credit')">📝 آجل</button>
        <button class="pm" data-pm="split" onclick="POS.setPayment('split')">🔀 مجزأ</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0">
        <button class="btn btn-w btn-sm" onclick="UI.openModal('discountModal')">🏷️ خصم (F8)</button>
        <button class="btn btn-g btn-sm" onclick="POS.holdCurrentCart()">⏸️ تعليق (F9)</button>
      </div>
      <button class="btn btn-s" style="width:100%;padding:12px;font-size:15px;margin-top:4px" onclick="POS.checkout()">
        ✅ إتمام وطباعة الفاتورة (F4)
      </button>
    </aside>
  </div>`;
}

const POS = {
  renderGrid(){
    const grid = $("posGrid"); if (!grid) return;
    const q = ($("posSearch")?.value || "").trim().toLowerCase();
    
    // شريط التصنيفات
    const categories = ["all", ...new Set(state.products.map(p => p.category))];
    $("catChips").innerHTML = categories.map(c => `
      <div class="cat-chip ${state.currentCategory === c ? 'active' : ''}" onclick="POS.setCat('${c}')">
        ${c === 'all' ? '🌟 الكل' : c}
      </div>
    `).join("");

    let items = state.products.filter(p => {
      const matchCat = state.currentCategory === "all" || p.category === state.currentCategory;
      const matchQuery = !q || p.name.toLowerCase().includes(q) || (p.barcode || "").includes(q);
      return matchCat && matchQuery;
    });

    if (q && items.length === 1 && items[0].barcode === q){
      this.addItem(items[0].id);
      $("posSearch").value = "";
      return;
    }

    grid.innerHTML = items.map(p => `
      <div class="pt-t ${p.quantity <= 0 ? 'off' : ''}" onclick="POS.addItem(${p.id})">
        <div class="pn">${esc(p.name)}</div>
        <div>
          <div class="pp">${Currency.format(p.sellPrice)}</div>
          <div style="font-size:10.5px;color:var(--muted)">المتوفر: ${p.quantity}</div>
        </div>
      </div>
    `).join("");
  },
  setCat(c){ state.currentCategory = c; this.renderGrid(); },
  addItem(id){
    const p = state.products.find(x => x.id === id);
    if (!p || p.quantity <= 0) return toast("الصنف غير متوفر", "error");
    const line = state.cart.find(c => c.id === id);
    if (line){
      if (line.qty + 1 > p.quantity) return toast("تجاوزت الرصيد المتاح", "warning");
      line.qty++;
    } else {
      state.cart.push({ id: p.id, name: p.name, price: p.sellPrice, buyPrice: p.buyPrice, qty: 1 });
    }
    this.renderCart();
  },
  changeQty(id, delta){
    const line = state.cart.find(c => c.id === id);
    if (!line) return;
    const p = state.products.find(x => x.id === id);
    const nq = line.qty + delta;
    if (nq <= 0) state.cart = state.cart.filter(c => c.id !== id);
    else if (nq > p.quantity) return toast("المخزون لا يكفي", "warning");
    else line.qty = nq;
    this.renderCart();
  },
  renderCart(){
    const box = $("cartItems"); if (!box) return;
    if (!state.cart.length){
      box.innerHTML = '<div style="text-align:center;padding:30px;color:var(--muted)">السلة فارغة</div>';
    } else {
      box.innerHTML = state.cart.map(i => `
        <div class="ci">
          <div class="ii"><strong>${esc(i.name)}</strong><span>${Currency.format(i.price)}</span></div>
          <div class="cq">
            <button onclick="POS.changeQty(${i.id},1)">+</button>
            <span>${i.qty}</span>
            <button onclick="POS.changeQty(${i.id},-1)">−</button>
          </div>
          <div class="cit">${Currency.format(i.price * i.qty)}</div>
        </div>
      `).join("");
    }
    const totals = this.calculateTotals();
    $("subTotal").textContent = Currency.format(totals.subtotal);
    $("discountDisplay").textContent = "-" + Currency.format(totals.discount);
    $("cartTotal").textContent = Currency.format(totals.finalTotal);
    $("cartCount").textContent = state.cart.reduce((s,i) => s + i.qty, 0);
    CustomerScreen.sync();
  },
  calculateTotals(){
    const subtotal = state.cart.reduce((s,i) => s + (i.price * i.qty), 0);
    let discount = 0;
    if (state.discount.type === "percent") discount = (subtotal * state.discount.value) / 100;
    else discount = Math.min(state.discount.value, subtotal);
    return { subtotal, discount, finalTotal: Math.max(0, subtotal - discount) };
  },
  setPayment(pm){
    state.paymentMethod = pm;
    document.querySelectorAll(".pm").forEach(b => b.classList.toggle("active", b.dataset.pm === pm));
  },
  applyDiscount(){
    state.discount = { type: $("discountType").value, value: Number($("discountVal").value) || 0 };
    UI.closeModal("discountModal");
    this.renderCart();
    toast("تم تطبيق الخصم");
  },
  holdCurrentCart(){
    if (!state.cart.length) return toast("السلة فارغة", "warning");
    state.heldCarts.push({ id: uid(), items: [...state.cart], date: new Date().toLocaleTimeString("ar-YE") });
    DB.set("heldCarts", state.heldCarts);
    state.cart = [];
    $("heldCount").textContent = state.heldCarts.length;
    this.renderCart();
    toast("تم تعليق الفاتورة");
  },
  showHeldCarts(){
    const box = $("heldList");
    if (!state.heldCarts.length) box.innerHTML = '<p style="text-align:center;padding:20px">لا توجد فواتير معلقة</p>';
    else {
      box.innerHTML = state.heldCarts.map(h => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--border)">
          <div><strong>فاتورة (${h.items.length} صنف)</strong><div style="font-size:11px;color:var(--muted)">${h.date}</div></div>
          <button class="btn btn-s btn-sm" onclick="POS.resumeCart(${h.id})">استعادة</button>
        </div>
      `).join("");
    }
    UI.openModal("heldModal");
  },
  resumeCart(id){
    const target = state.heldCarts.find(h => h.id === id);
    if (!target) return;
    state.cart = target.items;
    state.heldCarts = state.heldCarts.filter(h => h.id !== id);
    DB.set("heldCarts", state.heldCarts);
    $("heldCount").textContent = state.heldCarts.length;
    UI.closeModal("heldModal");
    this.renderCart();
  },
  checkout(){
    if (!state.cart.length) return toast("السلة فارغة!", "error");
    const totals = this.calculateTotals();
    
    // معالجة حساب العميل في حالة الآجل
    const cust = state.customers.find(c => c.id === state.selectedCustomer);
    if (state.paymentMethod === "credit"){
      if (cust.id === 1) return toast("لا يمكن البيع الآجل للعميل النقدي العام", "error");
      if (cust.balance + totals.finalTotal > cust.creditLimit) return toast("تجاوز العميل الحد الائتماني المسموح!", "error");
      cust.balance += totals.finalTotal;
      DB.set("customers", state.customers);
    }

    // خصم المخزون
    state.cart.forEach(item => {
      const p = state.products.find(x => x.id === item.id);
      if (p) p.quantity -= item.qty;
    });
    DB.set("products", state.products);

    const sale = {
      id: uid(),
      invoice: state.sales.length + 1001,
      cashier: Auth.user.fullName,
      customer: cust.name,
      paymentMethod: state.paymentMethod,
      currency: state.currency,
      date: new Date().toISOString(),
      items: [...state.cart],
      ...totals
    };

    state.sales.unshift(sale);
    DB.set("sales", state.sales);

    state.cart = [];
    state.discount = { type: "percent", value: 0 };
    this.renderCart();
    this.renderGrid();
    Receipt.print(sale);
    toast("تم إتمام العملية بنجاح!");
  }
};

const CustomerManager = {
  add(){
    const name = $("custName").value.trim();
    const phone = $("custPhone").value.trim();
    const creditLimit = Number($("custLimit").value) || 0;
    if (!name) return toast("أدخل اسم العميل", "error");
    state.customers.push({ id: uid(), name, phone, creditLimit, balance: 0 });
    DB.set("customers", state.customers);
    Navigation.go("customers");
    toast("تمت إضافة الحساب بنجاح");
  },
  payDebt(id){
    const cust = state.customers.find(c => c.id === id);
    const amount = Number(prompt(`تسجيل سند قبض - الرصيد الحالي: ${cust.balance}\nأدخل المبلغ المسدد:`));
    if (!amount || amount <= 0) return;
    cust.balance = Math.max(0, cust.balance - amount);
    DB.set("customers", state.customers);
    Navigation.go("customers");
    toast("تم تقييد سند القبض وتحديث الرصيد");
  }
};

function renderRegister(){
  const cashSales = state.sales.filter(s => s.paymentMethod === "cash").reduce((a,s) => a + s.finalTotal, 0);
  const ins = state.register.movements.filter(m => m.type === "in").reduce((a,m) => a + m.amount, 0);
  const outs = state.register.movements.filter(m => m.type === "out").reduce((a,m) => a + m.amount, 0);
  const expectedInDrawer = state.register.openingBalance + cashSales + ins - outs;

  return `
  <div class="stats">
    <div class="stat"><div class="sl">رصيد الافتتاح</div><div class="sv">${Currency.format(state.register.openingBalance)}</div></div>

    <div class="stat"><div class="sl">المصروفات النثرية (-)</div><div class="sv" style="--sc:var(--danger)">${Currency.format(outs)}</div></div>
    <div class="stat"><div class="sl">المفترض في الدرج</div><div class="sv" style="--sc:var(--primary)">${Currency.format(expectedInDrawer)}</div></div>

      <div class="ct">💵 حركات صندوق اليوم</div>

      <table style="width:100%;border-collapse:collapse;font-size:13px">

            <tr style="border-bottom:1px solid var(--border)">

          `).join("")}
        </tbody>
      </table>
    </div>
  </div>`;
}

/* ============================================================
   مسح الباركود بالكاميرا (Camera Scanner)
   ============================================================ */
let html5QrScanner = null;
const Scanner = {
  start(){
    UI.openModal("scannerModal");
    html5QrScanner = new Html5Qrcode("scannerReader");
    html5QrScanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      (decodedText) => {
        Scanner.stop();
        POS.addItemByBarcode(decodedText);
      },
      () => {}
    ).catch(() => toast("تعذر الوصول للكاميرا", "error"));
  },
  stop(){
    if (html5QrScanner){
      html5QrScanner.stop().then(() => {
        html5QrScanner.clear();
        UI.closeModal("scannerModal");
      });
    } else {
      UI.closeModal("scannerModal");
    }
  }
};

POS.addItemByBarcode = function(code){
  const p = state.products.find(x => x.barcode === code);
  if (p) { POS.addItem(p.id); toast("تم قراءة: " + p.name); }
  else toast("الباركود غير معرف: " + code, "warning");
};

/* ============================================================
   إدارة المخزون والمبيعات والتقارير
   ============================================================ */
function renderProducts(){
  return `
  <div class="card">
    <div class="ch"><div class="ct">📦 بطاقة صنف جديد</div></div>
    <div class="fr">
      <div class="fg"><label>اسم الصنف</label><input id="pName" class="form-control"></div>
      <div class="fg"><label>الباركود</label><input id="pBarcode" class="form-control"></div>
      <div class="fg"><label>التصنيف</label><input id="pCat" class="form-control"></div>
      <div class="fg"><label>سعر التكلفة</label><input id="pBuy" type="number" class="form-control"></div>
      <div class="fg"><label>سعر البيع</label><input id="pSell" type="number" class="form-control"></div>
      <div class="fg"><label>الكمية الأولية</label><input id="pQty" type="number" class="form-control"></div>
    </div>
    <button class="btn btn-p" onclick="ProductManager.add()">💾 حفظ الصنف</button>
  </div>
  <div class="card">
    <div class="ch"><div class="ct">📋 قائمة المخزون المستودعي</div></div>
    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr style="border-bottom:2px solid var(--border);text-align:right"><th style="padding:8px">الصنف</th><th>الباركود</th><th>التكلفة</th><th>البيع</th><th>الرصيد</th></tr></thead>
        <tbody>
          ${state.products.map(p => `
            <tr style="border-bottom:1px solid var(--border)">
              <td style="padding:8px"><strong>${esc(p.name)}</strong></td>
              <td>${esc(p.barcode || "-")}</td>
              <td>${Currency.format(p.buyPrice)}</td>
              <td>${Currency.format(p.sellPrice)}</td>
              <td><span class="badge ${p.quantity<=p.minStock ? 'lw' : 'ok'}">${p.quantity}</span></td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  </div>`;
}

const ProductManager = {
  add(){
    const name = $("pName").value.trim();
    const barcode = $("pBarcode").value.trim();
    const category = $("pCat").value.trim() || "عام";
    const buyPrice = Number($("pBuy").value) || 0;
    const sellPrice = Number($("pSell").value) || 0;
    const quantity = Number($("pQty").value) || 0;
    if (!name || sellPrice <= 0) return toast("أدخل البيانات بشكل صحيح", "error");
    state.products.unshift({ id: uid(), name, barcode, category, buyPrice, sellPrice, quantity, minStock: 5 });
    DB.set("products", state.products);
    Navigation.go("products");
    toast("تم حفظ الصنف بنجاح");
  }
};

function renderSales(){
  return `
  <div class="card">
    <div class="ch"><div class="ct">🧾 أرشيف فواتير المبيعات</div></div>
    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr style="border-bottom:2px solid var(--border);text-align:right"><th style="padding:8px">الفاتورة</th><th>التاريخ</th><th>العميل</th><th>الإجمالي</th><th>طريقة السداد</th></tr></thead>
        <tbody>
          ${state.sales.map(s => `
            <tr style="border-bottom:1px solid var(--border)">
              <td style="padding:8px"><strong>#${s.invoice}</strong></td>
              <td>${new Date(s.date).toLocaleDateString("ar-YE")}</td>
              <td>${esc(s.customer)}</td>
              <td style="font-weight:800;color:var(--primary)">${fmt(s.finalTotal)}${s.currency}</td>
              <td><span class="badge ct">${s.paymentMethod}</span></td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  </div>`;
}

function renderReports(){
  const totalSales = state.sales.reduce((a,s) => a + s.finalTotal, 0);
  const totalCost = state.sales.reduce((a,s) => a + s.items.reduce((acc, i) => acc + (i.buyPrice * i.qty), 0), 0);
  return `
  <div class="stats">
    <div class="stat"><div class="sl">المبيعات الكلية</div><div class="sv" style="--sc:var(--success)">${Currency.format(totalSales)}</div></div>
    <div class="stat"><div class="sl">الأرباح التقديرية</div><div class="sv" style="--sc:var(--info)">${Currency.format(totalSales - totalCost)}</div></div>
    <div class="stat"><div class="sl">عدد العمليات</div><div class="sv" style="--sc:var(--purple)">${state.sales.length}</div></div>
  </div>`;
}

/* ============================================================
   اختصارات لوحة المفاتيح والتحكم
   ============================================================ */
document.addEventListener("keydown", e => {
  if (e.key === "F1"){ e.preventDefault(); Navigation.go("pos"); }
  if (e.key === "F2"){ e.preventDefault(); $("posSearch")?.focus(); }
  if (e.key === "F4" && state.currentSection === "pos"){ e.preventDefault(); POS.checkout(); }
  if (e.key === "F8" && state.currentSection === "pos"){ e.preventDefault(); UI.openModal("discountModal"); }
  if (e.key === "F9" && state.currentSection === "pos"){ e.preventDefault(); POS.holdCurrentCart(); }
  if (e.key === "Escape"){ document.querySelectorAll(".overlay").forEach(o => o.classList.remove("active")); }
});

const UI = {
  toggleTheme(){
    const cur = document.documentElement.getAttribute("data-theme");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
  },
  openModal(id){ $(id).classList.add("active"); },
  closeModal(id){ $(id).classList.remove("active"); }
};

// تشغيل النظام والتحقق من الجلسة
Auth.checkSession();
