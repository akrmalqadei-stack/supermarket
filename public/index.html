<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>نظامي</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Tahoma,sans-serif}
body{background:#f1f5f9;color:#0f172a;padding:16px;padding-bottom:80px}
h1{font-size:20px;text-align:center;margin-bottom:16px;color:#0d9488}
.tabs{display:flex;gap:6px;background:#fff;padding:6px;border-radius:12px;margin-bottom:16px;overflow-x:auto}
.tabs button{flex:1;padding:10px;border:none;background:transparent;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;min-width:80px}
.tabs button.on{background:#0d9488;color:#fff}
.page{display:none}.page.on{display:block}
.card{background:#fff;padding:14px;border-radius:14px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
.card h2{font-size:15px;margin-bottom:10px;color:#0d9488}
input,select{width:100%;padding:11px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:14px;font-family:inherit;margin-bottom:8px;background:#f8fafc}
input:focus,select:focus{outline:none;border-color:#0d9488;background:#fff}
.btn{padding:11px 16px;border:none;border-radius:10px;background:#0d9488;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;width:100%}
.btn.g{background:#16a34a}.btn.r{background:#dc2626}.btn.b{background:#2563eb}.btn.o{background:#f59e0b}.btn.s{padding:6px 10px;font-size:12px;width:auto}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.row .btn{width:auto;flex:1;min-width:100px}
.item{background:#fff;padding:12px;border-radius:12px;margin-bottom:8px;border-right:4px solid #0d9488;box-shadow:0 2px 6px #0001}
.item .name{font-weight:700;font-size:14px;margin-bottom:6px}
.item .info{font-size:12px;color:#64748b;line-height:1.7}
.item .tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.tag{font-size:10px;padding:3px 8px;border-radius:99px;font-weight:700}
.tag.ok{background:#dcfce7;color:#166534}.tag.low{background:#fef3c7;color:#92400e}.tag.out{background:#fee2e2;color:#991b1b}
.stat{background:linear-gradient(135deg,#0d9488,#06b6d4);color:#fff;padding:14px;border-radius:12px;margin-bottom:10px}
.stat .lbl{font-size:12px;opacity:.9;margin-bottom:4px}
.stat .val{font-size:22px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cart-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
.cart-item .qty{color:#64748b;font-size:11px}
.total{background:#0d9488;color:#fff;padding:14px;border-radius:12px;text-align:center;font-size:20px;font-weight:800;margin-top:12px}
.empty{text-align:center;padding:30px;color:#94a3b8;font-size:13px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:999;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
.fab{position:fixed;bottom:20px;left:20px;width:56px;height:56px;border-radius:50%;background:#0d9488;color:#fff;border:none;font-size:26px;cursor:pointer;box-shadow:0 10px 25px #0d948866;z-index:100;display:none}
.fab.on{display:flex;align-items:center;justify-content:center}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:20px;z-index:1000}
.modal.on{display:flex}
.modal-box{background:#fff;padding:20px;border-radius:16px;max-width:400px;width:100%;max-height:80vh;overflow-y:auto}
.modal-box h3{font-size:16px;margin-bottom:12px}
</style>
</head>
<body>

<h1>🛒 نظامي</h1>

<div class="tabs">
  <button class="on" onclick="go('pos',this)">🛒 البيع</button>
  <button onclick="go('prod',this)">📦 منتجات</button>
  <button onclick="go('sales',this)">🧾 فواتير</button>
  <button onclick="go('rep',this)">📊 تقارير</button>
</div>

<!-- POS -->
<div id="pos" class="page on">
  <div class="card">
    <h2>اختر منتج</h2>
    <input id="search" placeholder="🔍 بحث..." oninput="renderGrid()">
    <div id="grid" class="grid2"></div>
  </div>
  <div class="card">
    <h2>🛒 السلة</h2>
    <div id="cart"></div>
    <div class="total" id="total">0</div>
    <div class="row">
      <button class="btn g" onclick="checkout()">✅ إتمام البيع</button>
      <button class="btn r" onclick="clearCart()">🗑️</button>
    </div>
  </div>
</div>

<!-- Products -->
<div id="prod" class="page">
  <div class="card">
    <h2>➕ إضافة منتج</h2>
    <input id="pName" placeholder="اسم المنتج">
    <input id="pBuy" type="number" placeholder="سعر الشراء">
    <input id="pSell" type="number" placeholder="سعر البيع">
    <input id="pQty" type="number" placeholder="الكمية">
    <input id="pMin" type="number" placeholder="الحد الأدنى" value="5">
    <button class="btn" onclick="addProduct()">إضافة</button>
  </div>
  <div class="card">
    <h2>📦 المنتجات</h2>
    <div id="prodList"></div>
  </div>
</div>

<!-- Sales -->
<div id="sales" class="page">
  <div class="card">
    <h2>🧾 الفواتير</h2>
    <div id="salesList"></div>
  </div>
</div>

<!-- Reports -->
<div id="rep" class="page">
  <div id="repStats"></div>
  <div class="card">
    <h2>🏆 الأكثر مبيعاً</h2>
    <div id="topList"></div>
  </div>
  <div class="card">
    <h2>⚠️ مخزون منخفض</h2>
    <div id="lowList"></div>
  </div>
  <div class="card">
    <button class="btn r" onclick="resetAll()">🗑️ حذف جميع البيانات</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DB = {
  products: JSON.parse(localStorage.getItem('p') || '[]'),
  sales: JSON.parse(localStorage.getItem('s') || '[]'),
  cart: [],
  counter: Number(localStorage.getItem('c') || '1000')
};

function save(){
  localStorage.setItem('p', JSON.stringify(DB.products));
  localStorage.setItem('s', JSON.stringify(DB.sales));
  localStorage.setItem('c', DB.counter);
}

function money(n){ return Number(n||0).toLocaleString('en-US') + ' ريال'; }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 2000);
}

function go(id, btn){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  btn.classList.add('on');
  if (id === 'pos') renderGrid();
  if (id === 'prod') renderProdList();
  if (id === 'sales') renderSales();
  if (id === 'rep') renderReports();
}

function renderGrid(){
  const q = (document.getElementById('search').value || '').toLowerCase();
  const list = DB.products.filter(p => !q || p.name.toLowerCase().includes(q));
  const g = document.getElementById('grid');
  if (!list.length){ g.innerHTML = '<div class="empty">لا منتجات</div>'; return; }
  g.innerHTML = list.map(p => `
    <button class="btn ${p.qty > 0 ? '' : 'r'}" style="padding:14px 10px;font-size:13px;text-align:right;line-height:1.4" onclick="addToCart(${p.id})">
      ${p.name}<br><small style="opacity:.85">${money(p.sell)}</small>
    </button>
  `).join('');
}

function addToCart(id){
  const p = DB.products.find(x => x.id === id);
  if (!p || p.qty <= 0) return toast('غير متوفر');
  const line = DB.cart.find(c => c.id === id);
  if (line){
    if (line.qty + 1 > p.qty) return toast('الكمية غير كافية');
    line.qty++;
  } else {
    DB.cart.push({ id: p.id, name: p.name, price: p.sell, qty: 1 });
  }
  renderCart();
}

function renderCart(){
  const c = document.getElementById('cart');
  if (!DB.cart.length){ c.innerHTML = '<div class="empty">السلة فارغة</div>'; }
  else {
    c.innerHTML = DB.cart.map(l => `
      <div class="cart-item">
        <div><strong>${l.name}</strong><br><span class="qty">${l.qty} × ${money(l.price)}</span></div>
        <div style="display:flex;gap:4px;align-items:center">
          <button class="btn s" onclick="changeQty(${l.id},-1)">−</button>
          <button class="btn s" onclick="changeQty(${l.id},1)">+</button>
        </div>
      </div>
    `).join('');
  }
  const t = DB.cart.reduce((s,l) => s + l.price * l.qty, 0);
  document.getElementById('total').textContent = money(t);
}

function changeQty(id, d){
  const l = DB.cart.find(x => x.id === id);
  if (!l) return;
  const p = DB.products.find(x => x.id === id);
  l.qty += d;
  if (l.qty <= 0) DB.cart = DB.cart.filter(x => x.id !== id);
  else if (l.qty > p.qty){ l.qty = p.qty; toast('الكمية الأقصى'); }
  renderCart();
}

function clearCart(){
  if (!DB.cart.length) return;
  DB.cart = [];
  renderCart();
}

function checkout(){
  if (!DB.cart.length) return toast('السلة فارغة');
  for (const l of DB.cart){
    const p = DB.products.find(x => x.id === l.id);
    p.qty -= l.qty;
  }
  const total = DB.cart.reduce((s,l) => s + l.price * l.qty, 0);
  DB.counter++;
  DB.sales.push({
    id: Date.now(),
    invoice: DB.counter,
    items: [...DB.cart],
    total,
    date: new Date().toISOString()
  });
  DB.cart = [];
  save();
  renderCart();
  renderGrid();
  toast('✅ تم البيع');
}

function addProduct(){
  const name = document.getElementById('pName').value.trim();
  const buy = Number(document.getElementById('pBuy').value) || 0;
  const sell = Number(document.getElementById('pSell').value) || 0;
  const qty = Number(document.getElementById('pQty').value) || 0;
  const min = Number(document.getElementById('pMin').value) || 5;
  if (!name){ return toast('أدخل الاسم'); }
  if (sell <= 0){ return toast('أدخل سعر البيع'); }
  DB.products.push({ id: Date.now(), name, buy, sell, qty, min });
  save();
  document.getElementById('pName').value = '';
  document.getElementById('pBuy').value = '';
  document.getElementById('pSell').value = '';
  document.getElementById('pQty').value = '';
  renderProdList();
  toast('✅ تمت الإضافة');
}

function renderProdList(){
  const l = document.getElementById('prodList');
  if (!DB.products.length){ l.innerHTML = '<div class="empty">لا منتجات</div>'; return; }
  l.innerHTML = DB.products.map(p => {
    const st = p.qty <= 0 ? 'out' : p.qty <= p.min ? 'low' : 'ok';
    const stT = p.qty <= 0 ? 'نفد' : p.qty <= p.min ? 'منخفض' : 'متوفر';
    return `
      <div class="item">
        <div class="name">${p.name}</div>
        <div class="info">شراء: ${money(p.buy)} | بيع: ${money(p.sell)} | كمية: ${p.qty}</div>
        <div class="tags"><span class="tag ${st}">${stT}</span></div>
        <div class="row" style="margin-top:8px">
          <button class="btn o s" onclick="addQty(${p.id})">➕ كمية</button>
          <button class="btn r s" onclick="delProduct(${p.id})">🗑️ حذف</button>
        </div>
      </div>
    `;
  }).join('');
}

function addQty(id){
  const p = DB.products.find(x => x.id === id);
  const amount = prompt('كم كمية تريد إضافتها؟', '10');
  if (!amount) return;
  p.qty += Number(amount);
  save();
  renderProdList();
  toast('✅ تمت الإضافة');
}

function delProduct(id){
  if (!confirm('حذف المنتج؟')) return;
  DB.products = DB.products.filter(x => x.id !== id);
  save();
  renderProdList();
  toast('🗑️ تم الحذف');
}

function renderSales(){
  const l = document.getElementById('salesList');
  if (!DB.sales.length){ l.innerHTML = '<div class="empty">لا فواتير</div>'; return; }
  l.innerHTML = DB.sales.slice().reverse().map(s => `
    <div class="item">
      <div class="name">فاتورة #${s.invoice}</div>
      <div class="info">${new Date(s.date).toLocaleString('ar-EG')}</div>
      <div class="info" style="margin-top:6px">
        ${s.items.map(i => `${i.name} × ${i.qty}`).join(' • ')}
      </div>
      <div style="font-weight:800;color:#0d9488;margin-top:8px">${money(s.total)}</div>
    </div>
  `).join('');
}

function renderReports(){
  const total = DB.sales.reduce((s,x) => s + x.total, 0);
  const count = DB.sales.length;
  const profit = DB.sales.reduce((s,x) => {
    return s + x.items.reduce((ss,i) => {
      const p = DB.products.find(y => y.id === i.id);
      return ss + (i.price - (p ? p.buy : 0)) * i.qty;
    }, 0);
  }, 0);

  document.getElementById('repStats').innerHTML = `
    <div class="stat"><div class="lbl">إجمالي المبيعات</div><div class="val">${money(total)}</div></div>
    <div class="stat" style="background:linear-gradient(135deg,#16a34a,#10b981)"><div class="lbl">إجمالي الأرباح</div><div class="val">${money(profit)}</div></div>
    <div class="stat" style="background:linear-gradient(135deg,#2563eb,#3b82f6)"><div class="lbl">عدد الفواتير</div><div class="val">${count}</div></div>
  `;

  const map = {};
  DB.sales.forEach(s => s.items.forEach(i => {
    if (!map[i.name]) map[i.name] = { name: i.name, qty: 0 };
    map[i.name].qty += i.qty;
  }));
  const top = Object.values(map).sort((a,b) => b.qty - a.qty).slice(0,5);
  document.getElementById('topList').innerHTML = top.length
    ? top.map((t,i) => `<div class="cart-item"><span>${i+1}. ${t.name}</span><strong>${t.qty}</strong></div>`).join('')
    : '<div class="empty">لا مبيعات</div>';

  const low = DB.products.filter(p => p.qty <= p.min);
  document.getElementById('lowList').innerHTML = low.length
    ? low.map(p => `<div class="cart-item"><span>${p.name}</span><strong style="color:#f59e0b">${p.qty}</strong></div>`).join('')
    : '<div class="empty">كل المنتجات جيدة</div>';
}

function resetAll(){
  if (!confirm('حذف كل البيانات؟')) return;
  DB.products = [];
  DB.sales = [];
  DB.cart = [];
  DB.counter = 1000;
  save();
  toast('🗑️ تم الحذف');
  renderProdList();
  renderSales();
  renderReports();
  renderGrid();
  renderCart();
}

// بدء
renderGrid();
renderCart();
</script>
</body>
</html>
